[project]
name = "fastapi-github-defaults"
version = "0.0.1"
description = "Shared defaults for FastAPI GitHub repositories"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.26.3",
]

[dependency-groups]
dev = [
    "prek>=0.4.3",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "ty>=0.0.40",
    "zizmor>=1.25.2",
]
